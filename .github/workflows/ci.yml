name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check translations
        run: python3 scripts/build-locales.py --check
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
