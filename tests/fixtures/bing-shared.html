<!doctype html><html><body>
<!-- Bing: Copilot shares a wrapper with the results, and the wrapper itself matches an AI selector. -->
<div id="b_content" aria-label="Copilot and search results">
  <div id="shared" class="b_copilot_page" data-bm="copilot-layout">
    <div id="b_copilot_search_container">Copilot answer</div>
    <ol id="b_topw"><li class="b_ans" id="ai-answer-card"><div id="copans_container">Generated answer</div></li></ol>
    <ol id="b_results">
      <li class="b_algo" id="result-1"><a href="https://example.com">Result one</a></li>
      <li class="b_algo" id="result-2"><a href="https://example.org">Result two</a></li>
    </ol>
  </div>
</div>
</body></html>
