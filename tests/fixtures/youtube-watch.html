<!doctype html><html><head><style>#movie_player{width:640px;height:360px;display:block}video{width:100%;height:100%}ytd-watch-metadata{display:block}</style></head><body>
<ytd-watch-flexy>
  <div id="movie_player"><video muted playsinline></video></div>
  <div id="below">
    <ytd-watch-metadata>
      <div id="actions"><button aria-label="Ask">Ask</button><button aria-label="Share">Share</button></div>
      <div id="description">A short film.</div>
    </ytd-watch-metadata>
  </div>
  <div id="secondary"><ytd-engagement-panel-section-list-renderer hidden>
    <how-this-was-made-section-view-model><div><span>Made with AI</span></div></how-this-was-made-section-view-model>
  </ytd-engagement-panel-section-list-renderer></div>
</ytd-watch-flexy>
<script>
  const c = document.createElement('canvas'); c.width = 64; c.height = 36;
  const ctx = c.getContext('2d'); setInterval(() => { ctx.fillStyle = '#' + Math.floor(Math.random()*999); ctx.fillRect(0,0,64,36); }, 50);
  const v = document.querySelector('video'); v.srcObject = c.captureStream(10); v.play().catch(() => {});
</script>
</body></html>
