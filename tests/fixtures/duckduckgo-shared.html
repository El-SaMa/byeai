<!doctype html><html><body>
<!-- DuckDuckGo: the Assist wrapper only holds the box; the page wrapper matches an AI class and holds the results. -->
<div id="page" class="DuckAssist-layout" data-testid="duckassist-layout">
  <div id="assist-wrap"><div id="assist-box" data-testid="duckassist-answer">Generated summary</div></div>
  <div id="assist-card-wrap"><ul><li id="assist-li"><div data-testid="duckassist-answer-content">Generated</div></li></ul></div>
  <ol class="react-results--main">
    <li><article data-testid="result" id="result-1"><a href="https://example.com">Result one</a></article></li>
    <li><article data-testid="result" id="result-2"><a href="https://example.org">Result two</a></article></li>
  </ol>
</div>
</body></html>
